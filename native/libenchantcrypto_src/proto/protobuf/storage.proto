syntax = "proto3";

package enchant.proto.storage;

message DecryptionErrorMessage {
  bytes  failed_x25519_key = 1;
  uint32 failed_counter    = 2;
  uint32 device_id          = 3;
  bytes  our_x25519_key    = 4;
}

message SessionStructure {
  message Chain {
    bytes sender_x25519_key         = 1;
    bytes sender_x25519_key_private = 2;
    bytes chain_key                  = 3;
  }

  message ReceiverChain {
    bytes x25519_key                = 1;
    bytes chain_key                  = 2;
    uint32 message_number            = 3;
  }

  message SkippedKey {
    bytes  dh_public_key  = 1;
    uint32 message_number = 2;
    bytes  message_key    = 3;
  }

  message ConsumedKey {
    bytes  dh_public_key  = 1;
    uint32 message_number = 2;
  }

  message PendingPreKey {
    optional uint32 pre_key_id        = 1;
             int32  signed_pre_key_id = 3;
             bytes  base_key          = 2;
             uint64 timestamp         = 4;
  }

  message PendingKyberPreKey {
    uint32 pre_key_id = 1;
    bytes  ciphertext = 2;
  }

  uint32         session_version           = 1;
  bytes          local_identity_public     = 2;
  bytes          remote_identity_public    = 3;

  bytes          root_key                  = 4;
  uint32         previous_counter          = 5;

  Chain          sender_chain              = 6;
  repeated ReceiverChain receiver_chains   = 7;

  uint32         sending_message_number    = 8;
  uint32         receiving_message_number   = 9;
  bool           receiver_has_key          = 10;

  bytes          our_identity              = 11;
  bytes          their_identity            = 12;
  bool           has_our_identity          = 13;
  bool           has_their_identity        = 14;

  repeated SkippedKey skipped_keys         = 15;
  repeated ConsumedKey consumed_keys       = 16;

  bytes          pqr_key                   = 17;
  bytes          pqr_sending_chain_key     = 18;
  bytes          pqr_receiving_chain_key   = 19;
  bool           has_pqr_key               = 20;

  bytes          kyber_ciphertext          = 21;
  bytes          their_kyber_public        = 22;
  bool           has_kyber_ciphertext      = 23;
  bool           has_their_kyber_public    = 24;

  uint32         remote_registration_id    = 25;
  uint32         local_registration_id     = 26;
  uint32         previous_sending_chain_length = 27;

  PendingPreKey  pending_pre_key           = 28;
  PendingKyberPreKey pending_kyber_pre_key = 29;

  bytes          envelope_state_data        = 30;
}

message RecordStructure {
  SessionStructure current_session = 1;
  repeated bytes previous_sessions = 2;
}

message PreKeyRecordStructure {
  uint32 id          = 1;
  bytes  public_key  = 2;
  bytes  private_key = 3;
}

message SignedPreKeyRecordStructure {
  uint32  id          = 1;
  bytes   public_key  = 2;
  bytes   private_key = 3;
  bytes   signature   = 4;
  fixed64 timestamp   = 5;
}

message IdentityKeyPairStructure {
  bytes public_key  = 1;
  bytes private_key = 2;
}

message SenderKeyStateStructure {
  message SenderChainKey {
    uint32 iteration = 1;
    bytes  seed      = 2;
  }

  message SenderMessageKey {
    uint32 iteration = 1;
    bytes  seed      = 2;
  }

  message SenderSigningKey {
    bytes public  = 1;
    bytes private = 2;
  }

  uint32                    message_version     = 5;
  uint32                    chain_id            = 1;
  SenderChainKey            sender_chain_key    = 2;
  SenderSigningKey          sender_signing_key  = 3;
  repeated SenderMessageKey sender_message_keys = 4;
  uint32                    iteration           = 6;
  uint32                    epoch               = 7;
  string                    sender_id          = 8;
}

message SenderKeyRecordStructure {
  repeated SenderKeyStateStructure sender_key_states = 1;
  uint32                           sender_key_id_counter = 2;
}