syntax = "proto2";

package enchant;

option java_package = "org.enchant.protos";
option java_outer_classname = "StorageServiceProtos";

message StorageManifest {
    optional uint64 version = 1;
    optional bytes value = 2;
}

message ManifestRecord {
    message Identifier {
        enum Type {
            CONTACT = 1;
            GROUPV1 = 2;
            GROUPV2 = 3;
            ACCOUNT = 4;
            STORY_DISTRIBUTION_LIST = 5;
            CALL_LINK = 6;
            CHAT_FOLDER = 7;
            NOTIFICATION_PROFILE = 8;
        }
        optional Type type = 1;
        optional bytes raw = 2;
    }
    optional uint64 version = 1;
    repeated Identifier identifiers = 2;
}

message StorageItem {
    optional bytes key = 1;
    optional bytes value = 2;
}

message StorageItems {
    repeated StorageItem items = 1;
}

message StorageRecord {
    oneof record {
        ContactRecord contact = 1;
        GroupV1Record groupV1 = 2;
        GroupV2Record groupV2 = 3;
        AccountRecord account = 4;
        StoryDistributionListRecord storyDistributionList = 5;
        CallLinkRecord callLink = 6;
        ChatFolderRecord chatFolder = 7;
        NotificationProfileRecord notificationProfile = 8;
    }
}

message ContactRecord {
    enum IdentityState {
        VERIFIED = 1;
        UNVERIFIED = 2;
    }

    message Nickname {
        optional string givenName = 1;
        optional string familyName = 2;
    }

    optional string serviceAci = 1;
    optional string servicePni = 2;
    optional string e164 = 3;
    optional bytes profileKey = 4;
    optional bytes identityKey = 5;
    optional IdentityState identityState = 6;
    optional bool blocked = 7;
    optional bool whitelisted = 8;
    optional bool archived = 9;
    optional uint64 mutedUntilTimestamp = 10;
    optional bool hideStory = 11;
    optional uint64 unregisteredTimestamp = 12;
    optional Nickname nickname = 13;
    optional string note = 14;
    optional uint32 avatarColor = 15;
}

message GroupV1Record {
    optional bytes id = 1;
}

message GroupV2Record {
    optional bytes masterKey = 1;
    optional bool blocked = 2;
    optional bool whitelisted = 3;
    optional bool archived = 4;
    optional uint64 mutedUntilTimestamp = 5;
}

message AccountRecord {
    optional bytes profileKey = 1;
    optional string displayName = 2;
    optional string about = 3;
    optional string avatarUrl = 4;
    optional bool readReceipts = 5;
    optional bool typingIndicators = 6;
    optional bool linkPreviews = 7;
    optional bool backupEnabled = 11;
    optional string username = 14;
    optional bool viewedReceipts = 23;
    optional uint32 defaultTimer = 27;
}

message StoryDistributionListRecord {
    optional bytes identifier = 1;
    optional string name = 2;
    repeated string recipientServiceIds = 3;
    optional uint64 deletedAtTimestamp = 4;
    optional bool allowsReplies = 5;
    optional bool isBlockList = 6;
}

message CallLinkRecord {
    optional bytes rootKey = 1;
    optional string name = 2;
    optional bytes adminPasskey = 3;
    optional uint32 revision = 4;
}

message ChatFolderRecord {
    optional bytes identifier = 1;
    optional string name = 2;
    optional uint64 deletedAtTimestamp = 3;
    repeated string allowedRecipientServiceIds = 4;
}

message NotificationProfileRecord {
    optional bytes identifier = 1;
    optional string name = 2;
    optional uint64 deletedAtTimestamp = 3;
    optional uint32 priority = 4;
}
