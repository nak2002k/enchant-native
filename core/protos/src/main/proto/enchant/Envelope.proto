syntax = "proto2";

package enchant;

option java_package = "org.enchant.protos";
option java_outer_classname = "EnvelopeProtos";

// Wire format must match backend src/proto/Envelope.proto exactly.
// Enchant uses its own custom envelope layout (not Signal's) — the backend
// relays this envelope verbatim between devices. The server does NOT inspect
// the payload; it only reads the routing/flag fields.
message Envelope {
    optional string envelope_id = 1;
    optional string sender_user_id = 2;
    optional string sender_device_id = 3;
    optional string recipient_user_id = 4;
    optional string recipient_device_id = 5; // empty = any device
    optional string message_type = 6;        // e.g. ENCRYPTED_MESSAGE, PREKEY_MESSAGE
    optional bytes payload = 7;              // serialized Content protobuf
    optional uint64 server_ts = 8;           // server timestamp (Unix ms)
    optional string sender_ts = 9;           // sender timestamp (Unix ms)
    optional bool sealed = 10;               // sealed sender (anonymous)
    optional string reply_token = 11;        // sealed sender reply token
    optional bool ephemeral = 12;            // true for typing — server does NOT persist
    optional bool urgent = 13 [default = false]; // call offers — push even if silent
}
